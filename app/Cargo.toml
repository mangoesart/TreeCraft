[package]
name = "treecraft"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# the program file is TreeCraft.exe (picture 23)
[[bin]]
name = "TreeCraft"
path = "src/main.rs"

[dependencies]
macroquad = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
rfd = "0.15"
flate2 = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
